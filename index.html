<title>Turkish Yolu</title>
<meta name="theme-color" content="#1A4E8F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column filling the screen; header, scrolling body, bottom tabs. Single deliberate light look (Iznik tiles on warm sand). */
:root {
  --ink: #1D2433; --muted: #5E5A52; --sand: #FFF3E0; --line: #F0E2CC; --card: #FFFFFF;
  --blue: #1F5FAE; --blue-d: #174A88; --navy: #1A4E8F; --teal: #0E7C70; --gold: #F5B700;
  --red: #C0392B; --green: #2E7D32; --plum: #A23B72;
  --display: 'Unbounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sand); color: var(--ink); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body { overscroll-behavior: none; }
.scroll { overscroll-behavior: contain; }
/* native iOS build (Capacitor): the app paints under the notch and home bar itself */
html.native .topbar { height: calc(64px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
html.native .tabs { height: calc(72px + env(safe-area-inset-bottom, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
html.native .lesson-top { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
html.native .foot { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
html.native .center-col { padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
html.native .topbar, html.native .tabs, html.native .lesson-top, html.native .foot { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
/* reminder */
.remind { flex-direction: row; align-items: center; gap: 12px; background: #FFF0E3; border-color: #F9C9A3; }
.remind-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.remind-text b { font: 700 16px/1.3 var(--body); color: #8A3A0C; }
.remind-btn { align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #E8590C; color: #fff; box-shadow: 0 3px 0 #A8400A; font: 800 14px/1 var(--body); letter-spacing: 0.04em; }
.rem-row { display: flex; align-items: center; gap: 10px; }
.rem-time { flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid #E3DED5; background: #fff; padding: 0 12px; font: 700 16px/1 var(--body); color: var(--ink); }
.rem-time:disabled { opacity: .5; }
.note { font: 500 13px/1.45 var(--body); color: var(--muted); }
button:disabled { cursor: default; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tiles { background-image: url(img/pattern.svg); background-size: 96px 96px; }
#app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; background-color: var(--sand); background-image: url(img/pattern.svg); background-size: 96px 96px; box-shadow: 0 0 0 1px var(--line); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 32px; display: flex; flex-direction: column; gap: 16px; }

/* header */
.topbar { flex-shrink: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--navy); box-shadow: 0 3px 0 #133A6B; position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand-name { font: 700 15px/1 var(--display); color: #fff; }
.mini-cat { width: 48px; height: 48px; padding: 0; border: 0; background: none; }
.mini-cat img { display: block; width: 44px; height: 44px; margin: 2px; }
.stats { display: flex; align-items: center; gap: 10px; }
.lvl { padding: 6px 9px; border-radius: 10px; background: var(--gold); color: #3D2B00; font: 800 13px/1 var(--body); }
.stat { display: flex; align-items: center; gap: 3px; font: 800 15px/1 var(--body); color: #fff; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs { flex-shrink: 0; height: 72px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 6px 8px; background: #fff; border-top: 2px solid var(--line); }
.tab { border: 0; border-radius: 12px; background: transparent; color: #6F695F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 11px/1 var(--body); }
.tab.on { background: #DCE8F8; color: var(--blue); }

/* generic */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.nopad { padding: 0; overflow: hidden; gap: 0; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row-between.top { align-items: flex-start; }
.eyebrow { font: 800 12px/1.2 var(--body); letter-spacing: 0.08em; }
.teal { color: var(--teal); }
.muted { color: var(--muted); font-weight: 500; }
.sm { font-size: 13px; font-weight: 600; }
.h1 { margin: 0; font: 700 22px/1.2 var(--display); }
.card-title { font: 700 16px/1.2 var(--body); }
.bar { height: 8px; border-radius: 99px; background: #F3EADB; overflow: hidden; }
.bar.thick { height: 12px; }
.bar.white { background: rgba(255,255,255,0.85); height: 10px; flex: 1; }
.bar.dark { background: rgba(255,255,255,0.25); height: 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }
.sm-bar { width: 60px; flex-shrink: 0; }

/* path */
.week { box-shadow: 0 4px 0 var(--line); }
.week-title { font: 700 17px/1.3 var(--body); text-wrap: balance; }
.unit { border-radius: 24px; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.unit-img { width: 100%; height: 112px; object-fit: contain; display: block; }
.unit-banner { border-radius: 18px; padding: 14px 14px 14px 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.unit-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.unit-title { font: 700 18px/1.2 var(--display); }
.unit-theme { font: 500 14px/1.3 var(--body); }
.tip-btn { flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center; }
.unit-prog { display: flex; align-items: center; gap: 10px; font: 700 13px/1 var(--body); color: #3D3A34; }
.unit-toggle { min-height: 44px; border-radius: 14px; border: 0; background: rgba(255,255,255,0.88); font: 800 14px/1 var(--body); }
.skip-btn { align-self: center; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 2px solid; background: #fff; font: 800 13px/1 var(--body); letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
.lock-text { text-align: center; font: 600 13px/1.3 var(--body); color: #3D3A34; }
.nodes { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 12px 0 4px; }
.day { align-self: stretch; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.day i { flex: 1; height: 2px; background: rgba(61,58,52,0.18); }
.day span { padding: 5px 10px; border-radius: 99px; background: #fff; font: 800 11px/1 var(--body); letter-spacing: 0.08em; color: #3D3A34; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.node { width: 66px; height: 60px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
.node:not(:disabled):active { transform: translateY(4px); }
.start-bubble { padding: 7px 12px; border-radius: 10px; background: #fff; border: 2px solid; font: 800 12px/1 var(--body); letter-spacing: 0.06em; animation: bob 1.6s ease-in-out infinite; }
.node-label { padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.8); font: 700 13px/1.2 var(--body); }
.node-label.dim { color: #6F695F; }
.finish { align-items: center; text-align: center; border-style: dashed; border-color: #E0A26B; }
.finish-title { font: 700 16px/1.2 var(--display); color: var(--blue); }

/* practice / words / profile */
.promo { border-radius: 20px; padding: 16px; color: #fff; display: flex; flex-direction: column; gap: 10px; }
.promo-head { display: flex; align-items: center; gap: 12px; }
.promo-head > div { display: flex; flex-direction: column; gap: 6px; }
.promo-head img { flex-shrink: 0; }
.promo-title { font: 700 19px/1.2 var(--display); }
.promo-title.sm { font: 700 18px/1.2 var(--body); }
.promo-text { font: 500 14px/1.45 var(--body); }
.promo-btn { height: 52px; border-radius: 14px; border: 0; background: #fff; font: 800 15px/1 var(--body); letter-spacing: 0.06em; }
.promo-btn:disabled { opacity: .6; }
.word-row { display: flex; align-items: center; gap: 10px; }
.word-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.word-txt b { font: 700 16px/1.25 var(--body); }
.word-txt span { font: 500 14px/1.25 var(--body); color: var(--muted); }
.say { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 0; background: #EAF1FB; display: flex; align-items: center; justify-content: center; }
.group-head { padding: 10px 16px; color: #fff; font: 800 12px/1.3 var(--body); letter-spacing: 0.06em; }
.group-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.empty { flex-direction: row; align-items: center; gap: 12px; border-style: dashed; border-color: #E0A26B; color: var(--muted); line-height: 1.5; }
.level-card { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); color: #fff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.lc-left { display: flex; flex-direction: column; gap: 10px; }
.lc-level { font: 700 40px/1 var(--display); }
.lc-sub { font: 500 14px/1.4 var(--body); }
.tiles4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { border: 2px solid; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.tile b { font: 800 24px/1 var(--body); font-variant-numeric: tabular-nums; }
.tile span { font: 500 13px/1.2 var(--body); color: var(--muted); }
.chart { height: 110px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; }
.col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col i { display: block; width: 100%; border-radius: 6px; }
.col-v { font: 600 11px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 11px; }
.col-l { font: 700 12px/1 var(--body); color: #6F695F; }
.col-l.today { color: var(--blue); }
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.chip { height: 44px; border-radius: 12px; border: 2px solid #E3DED5; background: #fff; font: 700 14px/1 var(--body); }
.chip.on { border-color: var(--blue); background: #DCE8F8; color: var(--blue); }
.toggle-row { padding-top: 6px; }
.tr-text { display: flex; flex-direction: column; gap: 4px; }
.tr-text b { font: 700 15px/1.2 var(--body); }
.tr-text span { font: 500 13px/1.35 var(--body); color: var(--muted); }
.switch { flex-shrink: 0; width: 64px; height: 36px; border-radius: 99px; border: 0; background: #C9BEAB; display: flex; align-items: center; padding: 0 4px; }
.switch i { width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on { background: var(--teal); }
.switch.on i { transform: translateX(28px); }
.sync { display: flex; align-items: center; gap: 8px; font: 500 13px/1.4 var(--body); color: var(--muted); }
.reset { height: 48px; border-radius: 14px; border: 2px solid #E3DED5; background: #fff; color: #9B2C1F; font: 700 14px/1 var(--body); }
.confirm { padding: 14px; border-radius: 14px; background: #FDECEA; display: flex; flex-direction: column; gap: 10px; color: #9B2C1F; font: 600 14px/1.4 var(--body); }
.confirm-row { display: flex; gap: 10px; }
.danger, .ghost { flex: 1; height: 44px; border-radius: 12px; font: 700 14px/1 var(--body); }
.danger { border: 0; background: var(--red); color: #fff; }
.ghost { border: 2px solid #E3DED5; background: #fff; color: var(--ink); }

/* cat */
.cat { position: relative; flex-shrink: 0; }
.cat img { display: block; width: 100%; height: 100%; }
.ear { position: absolute; top: 0; width: 40%; height: 38%; border: 0; padding: 0; background: transparent; border-radius: 40%; }
.ear.l { left: 8%; } .ear.r { right: 8%; }
.meow { position: absolute; top: -6px; padding: 5px 9px; border-radius: 12px; background: #fff; border: 2px solid #F9C9A3; color: #C2410C; font: 800 13px/1 var(--body); white-space: nowrap; pointer-events: none; animation: pop .25s ease-out; }
.meow.right { left: 70%; } .meow.left { right: 70%; }
.wiggle { animation: wiggle .6s ease-in-out; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg) scale(1.06); } 60% { transform: rotate(5deg) scale(1.04); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* lesson */
.lesson { background-color: var(--sand); }
.lesson-top { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.icon-btn.boxed { border-radius: 12px; border: 2px solid #E3DED5; background: #fff; }
.lt-mid { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.lbar { background: #EADFCB; height: 16px; }
.combo { height: 12px; text-align: center; font: 800 11px/12px var(--body); letter-spacing: 0.08em; color: #8A5F00; }
.hearts { flex-shrink: 0; display: flex; align-items: center; gap: 4px; font: 800 16px/1 var(--body); color: var(--red); }
.lesson-body { padding-top: 4px; }
.speaker-row { display: flex; align-items: flex-end; gap: 6px; }
.bubble { flex: 1; margin-bottom: 18px; padding: 12px 14px; background: #fff; border: 2px solid var(--line); border-radius: 18px 18px 18px 4px; font: 700 19px/1.3 var(--body); }
.prompt-card { flex-direction: row; align-items: center; gap: 14px; padding: 18px; }
.prompt { font: 700 26px/1.2 var(--body); }
.prompt-wrap { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-width: 0; }
.paw-q { position: relative; flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #FFE38A; background: radial-gradient(circle at 35% 30%, #FFF6C9, #F5B700 60%, #C98A00); color: #7A4A00; display: grid; place-items: center; box-shadow: 0 3px 0 #A06E00, inset 0 1px 0 rgba(255,255,255,0.8); cursor: pointer; padding: 0; animation: pawNudge 3.2s ease-in-out infinite; }
.paw-q svg { width: 20px; height: 20px; }
.paw-q b { position: absolute; top: -7px; right: -7px; width: 19px; height: 19px; border-radius: 50%; background: #1F5FAE; color: #fff; font: 800 12px/19px var(--body); text-align: center; border: 2px solid #fff; }
.paw-q:active { transform: translateY(2px); box-shadow: 0 1px 0 #A06E00; }
.paw-q.on { animation: none; background: radial-gradient(circle at 35% 30%, #FFFFFF, #FFD54F 60%, #E0A800); }
.hint-pop { position: absolute; left: 0; top: calc(100% + 10px); z-index: 3; max-width: 260px; padding: 10px 14px; border-radius: 14px; background: #1D2433; color: #fff; font: 700 16px/1.3 var(--body); box-shadow: 0 8px 20px rgba(29,36,51,0.3); animation: pop .18s ease-out; }
.hint-pop { display: flex; align-items: center; gap: 8px; }
.hp-say { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.16); display: grid; place-items: center; padding: 0; cursor: pointer; }
.hint-pop::before { content: ""; position: absolute; left: 22px; top: -6px; width: 12px; height: 12px; background: #1D2433; transform: rotate(45deg); border-radius: 2px; }
@keyframes pawNudge { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-12deg); } 92% { transform: rotate(10deg); } }
@media (prefers-reduced-motion: reduce) { .paw-q { animation: none; } }

.listen { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0; }
.big-say { width: 104px; height: 104px; border-radius: 28px; border: 0; background: var(--blue); box-shadow: 0 6px 0 var(--blue-d); display: flex; align-items: center; justify-content: center; }
.big-say:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-d); }
.link { border: 0; background: none; color: var(--blue); font: 600 14px/1 var(--body); padding: 12px; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opts.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid #E3DED5; border-bottom-width: 4px; background: #fff; color: var(--ink); font: 600 17px/1.3 var(--body); text-align: left; }
.opt.center { text-align: center; padding: 12px; }
.opt.sel { border-color: var(--blue); background: #EAF1FB; color: var(--blue-d); }
.opt.ok { border-color: var(--green); background: #E8F5E9; color: #1B5E20; }
.opt.bad { border-color: var(--red); background: #FDECEA; color: #9B2C1F; }
.opt.done { border-color: #EDE8DF; background: #F4F1EA; color: #A8A196; }
.opt:not(:disabled):active { transform: translateY(2px); }
.match { min-height: 60px; font-size: 16px; }
.match-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mcol { display: flex; flex-direction: column; gap: 12px; }
.decl { align-items: center; text-align: center; padding: 18px; }
.case-chip { padding: 6px 12px; border-radius: 99px; color: #fff; font: 800 12px/1 var(--body); letter-spacing: 0.06em; }
.decl-ru { font: 700 18px/1.3 var(--body); color: var(--ink); }
.decl-ru i { font-style: normal; font-weight: 600; color: var(--muted); }
.end-hint { align-self: stretch; margin-top: 4px; padding: 10px 12px; border-radius: 12px; background: #F4F8FC; border: 1px solid #DCE6F2; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.eh-label { font: 800 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: #5B6B80; }
.eh-end { font: 700 15px/1.35 var(--body); }
.eh-end .t-red, .eh-end .t-tr { white-space: nowrap; }
.eh-role { font: 500 13px/1.35 var(--body); color: var(--muted); }
.decl-noun { font: 700 30px/1.1 var(--body); }
.gram { padding: 18px; gap: 12px; }
.gram-line { font: 600 21px/1.6 var(--body); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.blank { min-width: 96px; padding: 0 8px; border-bottom: 3px solid; text-align: center; }
.hint { align-self: flex-start; padding: 6px 10px; border-radius: 10px; background: #E1F3EF; font: 700 13px/1.3 var(--body); color: #0A5E55; }
.build-ru { font: 600 19px/1.4 var(--body); }
.answer-zone { min-height: 108px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 48px, #E0D3BD 48px, #E0D3BD 50px, transparent 50px, transparent 54px); }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 6px; }
.tile-btn { height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #E3DED5; border-bottom-width: 4px; background: #fff; color: var(--ink); font: 600 17px/1 var(--body); display: inline-flex; align-items: center; }
.ghost-tile { background: #E9DFCE; border-color: #E9DFCE; color: transparent; }
.foot { flex-shrink: 0; padding: 16px 20px 22px; border-top: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; gap: 10px; }
.foot.plain { border: 0; background: transparent; }
.foot.good { background: #E8F5E9; border-color: #C8E6C9; color: #1B5E20; }
.foot.fail { background: #FDECEA; border-color: #F5C6C0; color: #9B2C1F; }
.fb-title { display: flex; align-items: center; gap: 10px; font: 800 20px/1.2 var(--body); }
.fb-answer { font: 600 16px/1.4 var(--body); }
.match-hint { min-height: 52px; display: flex; align-items: center; justify-content: center; text-align: center; font: 600 14px/1.35 var(--body); color: var(--muted); }
.cta { height: 52px; border-radius: 14px; border: 0; color: #fff; font: 800 15px/1 var(--body); letter-spacing: 0.06em; }
.cta:not(:disabled):active { transform: translateY(3px); }
.cta.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); }
.cta.green { background: var(--green); box-shadow: 0 4px 0 #1B5E20; }
.cta.red { background: var(--red); box-shadow: 0 4px 0 #8E2A20; }
.cta.orange { background: #E8590C; box-shadow: 0 4px 0 #A8400A; }
.cta.off { background: #E2D9CA; color: #6F695F; box-shadow: 0 4px 0 #C9BEAB; }

/* result / streak */

.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; z-index: 6; background: #FFF8EE; border-radius: 24px 24px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease-out; }

/* ===== Glossy 3D finish: soft light from top-left, specular highlights, soft drop shadows ===== */

}

/* rich unit rules */

/* pet */
.tabs { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }

.play-text { margin: 0; text-align: center; display: flex; flex-direction: column; gap: 4px; }

@keyframes popIn { from { transform: translateY(-50%) scale(.7); opacity: 0; } to { transform: translateY(-50%) scale(1); opacity: 1; } }

{"title":"Чувства и отношения","theme":"Настоящее время -iyor, var / yok","level":"A1.1","img":"img/a1-friends.svg","imgAlt":"Друзья пьют чай и улыбаются","tipTitle":"Настоящее время на -iyor и слова var / yok","tip":"1) Настоящее время -iyor\nОзначает «сейчас» и «обычно», как русское «я иду», «я люблю».\nБерём основу глагола без -mak/-mek и добавляем -ıyor/-iyor/-uyor/-üyor.\n• после a, ı → -ıyor; после e, i → -iyor; после o, u → -uyor; после ö, ü → -üyor\n• если основа кончается на гласную, эта гласная выпадает: anla → anlıyor, söyle → söylüyor\nПример: Çay içiyorum. — Я пью чай.\n2) Окончания лица после -yor\nПосле -yor окончание больше не меняется: гласная всегда «u».\n• ben -um, sen -sun, o — без окончания\n• biz -uz, siz -sunuz, onlar -lar\nПример: Seni seviyorum. — Я тебя люблю.\n3) Отрицание и вопрос\nОтрицание: -ma/-me перед -iyor, получается -mıyor/-miyor/-muyor/-müyor.\nВопрос: частица mu пишется отдельно, окончание лица переходит на неё.\n• Geliyor musun? Seviyor musunuz? O geliyor mu?\n• вежливые просьбы учим целиком: Su verir misiniz?\nПример: Bugün gelmiyorum. — Сегодня я не приду.\n4) var и yok\nvar — «есть, имеется», yok — «нет, не имеется». Они не меняются по лицам.\n• вопрос: var mı? — ответ: Evet, var. / Hayır, yok.\nПример: Burada çay var mı? — Здесь есть чай?","greens":["«сейчас» и «обычно»","эта гласная выпадает","окончание больше не меняется","пишется отдельно","окончание лица переходит на неё","не меняются по лицам","учим целиком"],"table":{"title":"Шпаргалка: настоящее время -iyor","cols":["Форма","Как образуется","Пример"],"rows":[["утверждение","-ıyor/-iyor/-uyor/-üyor + лицо","geliyorum"],["отрицание","-mıyor/-miyor/-muyor/-müyor","gelmiyorum"],["вопрос","-iyor + mu + лицо","Geliyor musun?"],["они","-iyorlar","geliyorlar"],["есть / нет","var / yok","Çay var mı?"]]},"examples":[["Ne yapıyorsun?","Что ты делаешь?"],["Seni çok seviyorum.","Я тебя очень люблю."],["Bugün gelmiyorum, çok yorgunum.","Сегодня я не приду, я очень устал."],["Kahve {"title":"Тело и описание человека","theme":"Притяжательные аффиксы, bu/şu/o","level":"A1.2","img":"img/a2-body.svg","imgAlt":"Зеркало, одежда и аксессуары в уютной комнате","tipTitle":"Мой, твой, его: притяжательные аффиксы и bu/şu/o","tip":"1) Мой, твой, его: окончание вместо слова\nВ турецком «мой, твой, его» — это окончание в конце слова, а не отдельное слово, как в русском.\n• я: -ım/-im/-um/-üm, после гласной только -m: el → elim, çanta → çantam\n• ты: -ın/-in/-un/-ün, после гласной только -n: göz → gözün, çanta → çantan\n• он/она: -ı/-i/-u/-ü, после гласной вставляется s: saç → saçı, çanta → çantası\nСлова benim, senin, onun добавляют для акцента, но окончание нужно всегда.\nПример: Benim saçım uzun. — У меня длинные волосы.\n2) Буква k перед гласной смягчается\nЕсли слово кончается на k, а окончание начинается с гласной, k смягчается и пишется как ğ.\n• ayak → ayağım, gözlük → gözlüğün, gömlek → gömleği\nПример: Ayağım ağrıyor. — У меня болит нога.\n3) Два существительных вместе: Türk kahvesi\nПервое слово описывает второе: первое без окончания, второе получает -ı/-i/-u/-ü (после гласной -sı/-si/-su/-sü).\nПо-русски это обычно прилагательное или родительный падеж: «турецкий кофе», «цвет глаз».\nПример: göz rengi — цвет глаз\nПример: Türk kahvesi — турецкий кофе\n4) Указательные слова bu, şu, o\n• bu — этот, рядом со мной; şu — вон тот, на него показывают; o — тот, далеко\n• во множественном числе: bunlar, şunlar, onlar\nЕсли вещь — прямое дополнение, добавляем -u/-ı/-i: bunu, şunu, onu, bu kitabı, şu gömleği.\nПример: Bu gömleği beğendim. — Мне понравилась эта рубашка.","greens":["в конце слова","после гласной только","после гласной вставляется","окончание нужно всегда","смягчается","первое без окончания","рядом со мной","далеко"],"table":{"title":"Шпаргалка: мой, твой, его","cols":["Что","После согласной","После гласной"],"rows":[["я (benim)","-ım/-im/-um/-üm: elim","-m: çantam"],["ты (senin)","-ın/-in/-un/-ün: gözün","-n: çantan"],["он/она (onun)","-ı/-i/-u/-ü: saçı","-sı/-si/-su/-sü: çantası"],["два существительных","göz rengi","Türk kahvesi"],["это / вон то (вин.)","bu kitabı, şunu","bu çantayı, bunu"]]},"examples":[["Benim saçım kıvırcık.","У меня кудрявые волосы."],["Onun göz rengi yeşil.","Цвет его глаз зелёный."],["Başım ağrıyor, doktora gitmem lazım.","У меня болит голова, мне нужно к врачу."],["Bir Türk kahvesi, lütfen.","Один турецкий кофе, пожалуйста."],["Bu gömleği beğendim.","Мне понравилась эта рубашка."]],"words":[["baş","голова"],["göz","глаз"],["kulak","ухо"],["burun","нос"],["ağız","рот"],["saç","волосы"],["diş","зуб"],["el","рука, кисть"],["kol","рука (от плеча)"],["bacak","нога"],["ayak","ступня"],["yüz","лицо"],["uzun","длинный"],["kısa","короткий"],["uzun boylu","высокий (ростом)"],["kısa boylu","низкий (ростом)"],["zayıf","худой"],["şişman","полный, толстый"],["genç","молодой"],["yaşlı","пожилой, старый"],["güzel","красивый"],["yakışıklı","красивый (о мужчине)"],["sarışın","светловолосый"],["esmer","смуглый, темноволосый"],["kıvırcık","кудрявый"],["düz","прямой (о волосах)"],["gözlük","очки"],["sakal","борода"],["renk","цвет"],["beyaz","белый"],["siyah","чёрный"],["kırmızı","красный"],["mavi","синий, голубой"],["yeşil","зелёный"],["sarı","жёлтый"],["kahverengi","коричневый"],["gri","серый"],["pembe","розовый"],["turuncu","оранжевый"],["elbise","платье"],["gömlek","рубашка"],["pantolon","брюки"],["etek","юбка"],["tişört","футболка"],["ayakkabı","обувь, туфли"],["şapka","шапка, шляпа"],["çanta","сумка"],["mont","куртка"],["kazak","свитер"],["bu","этот, это"],["şu","вон тот"],["Başım ağrıyor","у меня болит голова"],["Hastayım","я болен"],["Doktora gitmem lazım","мне нужно к врачу"],["Eczane nerede?","где аптека?"],["Yardım edin!","помогите!"],["Ambulans çağırın!","вызовите скорую!"],["Acil yardıma ihtiyacım var","мне нужна срочная помощь"],["Geçmiş olsun","скорейшего выздоровления"],["bunlar","эти, это (мн.)"]],"sentences":[["Мои глаза голубые.","Gözlerim mavi."],["У тебя очень красивые глаза.","Gö {"title":"Покупки и быт","theme":"Местный падеж, var/yok, числа","level":"A1.2","img":"img/a3-market.svg","imgAlt":"Прилавок с фруктами и овощами на рынке","tipTitle":"Где? Сколько? Местный падеж, var/yok и числа","tip":"1) Местный падеж: где?\nОтвечает на вопрос «где?», как русские «в» и «на»: evde — дома, masada — на столе.\n• -da/-de по гармонии гласных: ev → evde, oda → odada\n• после глухих согласных (p, ç, t, k, f, h, s, ş) — -ta/-te: mutfak → mutfakta, market → markette\nПример: Annem mutfakta. — Мама на кухне.\n2) Var и yok: есть и нет\nvar — «есть, имеется», yok — «нет». В вопросе: var mı? yok mu?\nПорядок слов: сначала место, потом предмет, а var или yok в конце.\nПример: Evde süt var mı? — Дома есть молоко?\nПример: Odada televizyon yok. — В комнате нет телевизора.\n3) Числа и множественное число\n• 10 on, 20 yirmi, 30 otuz, 40 kırk, 50 elli, 60 altmış, 70 yetmiş, 80 seksen, 90 doksan\n• 100 yüz, 1000 bin (без bir), числа просто ставятся рядом: iki yüz yirmi beş — 225\nМножественное число: -lar/-ler (elmalar, evler), но после числа слово всегда в единственном числе.\nПример: üç elma — три яблока\nПример: iki kilo domates — два килограмма помидоров\n4) Kaç? и Ne kadar?\n• Kaç? — «сколько?» для счёта, после него тоже единственное число: Kaç oda?\n• Ne kadar? — «сколько стоит?» для цены, а также «сколько?» для количества\nПример: Kilosu kaç lira? — Сколько стоит килограмм?\nПример: Bu ne kadar? — Сколько это стоит?","greens":["по гармонии гласных","после глухих согласных","сначала место","в конце","всегда в единственном числе","для счёта","для цены"],"table":{"title":"Шпаргалка: где и сколько","cols":["Правило","Окончание или слово","Пример"],"rows":[["где? (после гласной и звонкой)","-da/-de","evde, odada"],["где? (после глухой)","-ta/-te","mutfakta, markette"],["есть / нет","var / yok","Evde süt var mı?"],["число + существительное","без -lar/-ler","üç elma"],["сколько?","Kaç? / Ne kadar?","Kilosu kaç lira?"]]},"examples":[["Annem mutfakta.","Мама на кухне. {"title":"Город и направления","theme":"Куда, откуда и где: падежи места","level":"A2.1","img":"img/a5-city.svg","imgAlt":"Улица с указателями, трамваем и картой","tipTitle":"Дательный -a/-e, исходный -dan/-den и слова места","tip":"1) Куда? Дательный падеж -a / -e\nОтвечает на вопрос «куда?»: ev → eve, okul → okula. После гласной вставляется y: banka → bankaya.\n• Глухие p, ç, t, k перед гласной часто становятся звонкими: sokak → sokağa.\nПример: Bu otobüs hastaneye gider mi? — Этот автобус идёт до больницы?\n2) Откуда? Исходный падеж -dan / -den\nОтвечает на вопрос «откуда?»: okuldan, evden. После глухих согласных (p, ç, t, k, f, h, s, ş) — -tan/-ten: parktan.\nПример: Evden okula yürüyorum. — Я иду из дома в школу пешком.\n3) Где именно? Слова места: masanın altında\nСхема: чей предмет (-ın/-in) + слово места + -nda/-nde. Дословно «под столом» звучит как «в низу стола».\n• altında — под, üstünde — на, içinde — в, внутри\n• önünde — перед, arkasında — за, yanında — рядом с\n• iki bina arasında — между двумя зданиями\nПример: Kedi masanın altında. — Кошка под столом.\n4) Вежливая просьба: -ın / -in / -un / -ün\nК основе глагола добавляем -ın/-in/-un/-ün по гармонии гласных: dönün, durun. Так вежливо обращаются на «вы».\n• gitmek → gidin: t перед гласной становится d.\nПример: Sağa dönün, sonra düz gidin. — Поверните направо, потом идите прямо.","greens":["Отвечает на вопрос «куда?»","После гласной вставляется","Отвечает на вопрос «откуда?»","После глухих согласных","чей предмет","по гармонии гласных","вежливо обращаются на «вы»"],"table":{"title":"Шпаргалка: куда, откуда, где","cols":["Вопрос","Окончание","Пример"],"rows":[["куда?","-a/-e, -ya/-ye","eve, bankaya"],["откуда?","-dan/-den, -tan/-ten","okuldan, parktan"],["где?","-da/-de, -ta/-te","evde, parkta"],["где именно?","-ın/-in + место + -nda/-nde","masanın altında"],["вежливая просьба","-ın/-in/-un/-ün","dönün, gidin"]]},"examples":[["Müzeye nasıl giderim?","Как мне добраться до музея?"],["Bu otobüs hastaneye {"title":"Работа и прошлая карьера","theme":"Прошедшее время -di и -miş","level":"A2.2","img":"img/a6-work.svg","imgAlt":"Рабочее место с инструментами разных профессий и календарём","tipTitle":"Прошедшее: -di (знаю точно) и -miş (говорят)","tip":"1) Прошедшее время на -di: я сделал, я был\nОкончание -di говорит о действии, которое точно было: вы видели его сами или знаете наверняка.\nГармония гласных: -dı/-di/-du/-dü. После глухих согласных (p, ç, t, k, f, h, s, ş) — -tı/-ti/-tu/-tü.\nЛицо — короткое окончание после -di: -m (я), -n (ты), ничего (он), -k (мы), -nız/-niz (вы), -lar/-ler (они).\n• gel → geldim, geldin, geldi, geldik, geldiniz, geldiler\n• çalış → çalıştım (я работал), git → gittim (я ходил)\nПример: Geçen yıl Türkiye'ye taşındım. — В прошлом году я переехал в Турцию.\n2) Отрицание и вопрос\nОтрицание: -ma/-me ставится перед -di: gelmedi, çalışmadım.\nВопрос: частица mi пишется отдельно, после глагола с лицом: gittin mi?, geldiniz mi?\nПример: Dün işe gittin mi? — Ты вчера ходил на работу?\n3) «Был» с существительными: -dım/-dim\nПо-русски «я был учителем», а по-турецки окончание просто добавляется к слову: öğretmendim.\nПосле гласной вставляется y: öğrenciydim, evdeydik. После глухих — -tı/-ti: mühendistim.\nПример: Türkiye'ye gelmeden önce Moskova'da öğretmendim. — До приезда в Турцию я был учителем в Москве.\n4) -miş: «говорят, оказывается»\n-mış/-miş/-muş/-müş — о том, что вы не видели сами: услышали от других или поняли по результату.\nСравните: -di — видел сам, знаю точно; -miş — мне рассказали, я сам не видел.\nПример: Ali işini bırakmış. — Говорят, Али бросил работу.\nПример: Ali işini bıraktı. — Али бросил работу (я знаю точно).","greens":["которое точно было","После глухих согласных","ставится перед","пишется отдельно, после глагола","окончание просто добавляется к слову","После гласной вставляется y","вы не видели сами","видел сам, знаю точно"],"table":{"title":"Шпаргалка: прошедшее время","cols":["Форма","Окончание","Пример"],"rows":[["прош {"title":"Путешествия и транспорт","theme":"Будущее и настоящее-общее время","level":"A2.2","img":"img/a7-travel.svg","imgAlt":"Вокзал с поездом, автобусом, самолётом и чемоданом","tipTitle":"Будущее -acak, настоящее-общее и «нужно / могу»","tip":"1) Будущее время: -acak/-ecek\nОкончание -acak/-ecek значит «буду делать, сделаю»: gideceğim — я поеду.\nПеред гласной окончания лица k меняется на ğ: gideceğim, geleceğiz. Но без гласной k остаётся: gidecek, gideceksin.\nПосле гласной основы вставляется y: oku → okuyacak, bekle → bekleyeceğim.\n• gitmek → gideceğim (t → d перед гласной), yapmak → yapacağım\nОтрицание: -mayacak/-meyecek (gelmeyecek). Вопрос: mi отдельно (gelecek misin?).\nПример: Yarın yağmur yağacak. — Завтра будет дождь.\n2) Настоящее-общее время (geniş zaman)\nГоворит о привычках и фактах: «обычно, всегда, каждое лето».\n• после гласной просто -r: okurum, beklerim\n• многосложные глаголы: -ır/-ir/-ur/-ür: çalışırım, yürürüm\n• почти все односложные: -ar/-er: yaparım, içerim, giderim\n• запомните исключения на -ir: gelirim, alırım, kalırım, bilirim, görürüm, veririm\nОтрицание: -mam/-mem (я), -maz/-mez (он, она): sigara içmem, gitmez.\nВежливое предложение звучит через этот вопрос: Çay içer misiniz? — Не хотите чаю?\nПример: Her yaz denize giderim. — Каждое лето я езжу на море.\n3) Нужно и могу: lazım, gerek, -ebilmek\nlazım и gerek значат «нужно» и стоят в конце: Bana taksi lazım. — Мне нужно такси.\nС глаголом в начальной форме: Erken kalkmak gerek. — Нужно рано встать.\n-abil/-ebil значит «мочь»: gidebilirim — я могу поехать. «Не могу»: -ama/-eme: gidemem.\nПример: Yarın gelebilir misin? — Ты можешь прийти завтра?","greens":["буду делать, сделаю","Перед гласной окончания лица","о привычках и фактах","после гласной просто","почти все односложные","запомните исключения","Вежливое предложение","стоят в конце"],"table":{"title":"Шпаргалка: будущее, привычки, «нужно / могу»","cols":["Форма","Окончание","Пример"],"rows":[["будущее","-acak/-ecek (k → ğ)","gi {"title":"Работа и карьера","theme":"Родительный падеж и изафет","level":"B1.2","img":"img/u4-career.svg","imgAlt":"Ноутбук с графиком и портфель","tipTitle":"Чей? -ın, изафет и цепочки изафетов","tip":"1) Родительный падеж и изафет\nРодительный: -ın/-in/-un/-ün, после гласной -nın/-nin: şirketin, yöneticinin.\nИзафет «что-то чего-то»: родительный + притяжательное окончание: şirketin müdürü — директор компании.\nБез родительного — общее понятие: iş görüşmesi — собеседование (вообще).\nПосле притяжательного окончания падеж присоединяется через n: şirketin müdürünü, müdürüne, müdüründen.\nВыпадение гласной: fikir → fikrim, isim → ismi.\n2) Местоимения в родительном падеже\nbenim, senin, onun, bizim, sizin, onların + притяжательное окончание: benim maaşım, bizim şirketimiz.\nМестоимение обычно опускают: maaşım — моя зарплата; его ставят для выделения.\nПример: Bu benim fikrim! — Это моя идея!\n3) Цепочки изафетов\nИзафет может входить в другой изафет; каждое звено в родительном падеже.\nПример: Müdürün asistanının telefonu — телефон ассистента директора.\nСоставное имя тоже получает родительный: satış müdürünün odası — кабинет директора по продажам.","examples":[["Şirketin yöneticisi toplantıda.","Руководитель компании на совещании."],["Sözleşmenin süresi bir yıl.","Срок договора — один год."],["Müdür fikrimi beğendi.","Директору понравилась моя идея."],["Bizim ekibimiz bu projeyi yönetiyor.","Наша команда руководит этим проектом."],["Müdürün asistanının telefonu kapalı.","Телефон ассистента директора выключен."]],"words":[["başvuru","заявка, отклик"],["özgeçmiş","резюме"],["mülakat","собеседование"],["deneyim","опыт"],["terfi","повышение"],["istifa etmek","уволиться (сам)"],["sözleşme","договор"],["yönetici","руководитель"],["çalışan","сотрудник"],["şirket","компания"],["sorumluluk","ответственность"],["yetenek","способность, талант"],["maaş","зарплата"],["iş ilanı","объявление о вакансии"],["iş yeri","место работы"],["iş arkadaşı","коллега"],["müdür","директор"],["pa {"title":"Путешествия","theme":"-la, -lı, -sız и движение","level":"B1+","img":"img/u5-balloons.svg","imgAlt":"Воздушные шары над холмами Каппадокии","tipTitle":"С кем? На чём? Без чего? Откуда и куда?","tip":"1) Совместный падеж, -lı и -sız\n-la/-le (после гласной -yla/-yle) — «с, на»: uçakla — на самолёте, arkadaşımla — с подругой.\n-lı/-li — «с чем-то» (свойство): manzaralı oda — номер с видом.\n-sız/-siz — «без»: vizesiz — без визы, sorunsuz — без проблем.\nМаршрут: -dan … -a: İzmir'den Bodrum'a. Через: -dan geçmek: gümrükten geçtik.\nВ составных словах падеж идёт после притяжательного: havalimanı → havalimanında.\n2) ile с местоимениями\nПрисоединяется к форме родительного падежа: benimle, seninle, onunla, bizimle, sizinle. Но: onlarla (не onlarınla).\nГлаголы взаимодействия требуют -la: karşılaşmak, buluşmak, konuşmak.\nПример: Benimle tatile gelir misin? — Поедешь со мной в отпуск?\n3) Множественное число + падеж\nСначала -lar/-ler, потом падеж; гармония идёт по -lar/-ler: otel → otellerde, şehir → şehirlerden, plaj → plajlara.\nЧередование k → ğ не происходит: -lar начинается с согласной: durak → duraklarda.\nПример: Otellerde yer kalmadı. — В отелях не осталось мест.","examples":[["Gümrükten sorunsuz geçtik.","Мы прошли таможню без проблем."],["Deniz manzaralı bir oda istiyorum.","Я хочу номер с видом на море."],["Rehberle şehri keşfettik.","Мы исследовали город с гидом."],["Benimle tatile gelir misin?","Поедешь со мной в отпуск?"],["Otellerde yer kalmadı.","В отелях не осталось мест."]],"words":[["bavul","чемодан"],["konaklama","проживание"],["rezervasyon","бронирование"],["gümrük","таможня"],["vize","виза"],["rehber","гид"],["manzara","вид, пейзаж"],["yolculuk","поездка, путь"],["aktarma","пересадка"],["gecikme","задержка"],["sırt çantası","рюкзак"],["keşfetmek","открывать, исследовать"],["havalimanı","аэропорт"],["uçuş","рейс, полёт"],["bilet","билет"],["pasaport","паспорт"],["biniş kartı","посадочный талон"],["kalkış","вылет, отправление"],["varış","при ptal edildi."],["Ты путешествуешь без визы?","Vizesiz mi seyahat ediyorsun?"],["Он вышел из поезда на этой станции?","Bu istasyonda trenden indi mi?"],["Мы купили сувениры для друзей.","Arkadaşlarımız için hediyelik eşya aldık."],["Вы, ребята, поедете в Каппадокию на автобусе?","Kapadokya'ya otobüsle mi gideceksiniz?"],["Пассажиры сели в самолёт.","Yolcular uçağa bindi."],["В отелях не осталось мест.","Otellerde yer kalmadı."],["Я не взял с собой много багажа.","Yanıma çok bagaj almadım."],["Почему ты не пристегнул ремень безопасности?","Neden emniyet kemerini takmadın?"],["Этот гостевой дом без завтрака?","Bu pansiyon kahvaltısız mı?"],["В аэропорту мы случайно встретили соседа.","Havalimanında komşumuzla karşılaştık."],["Мы заблудились в старом городе.","Eski şehirde yolumuzu kaybettik."],["Туристы приезжают из разных стран.","Turistler farklı ülkelerden geliyor."],["Вы, ребята, не устали после поездки?","Yolculuktan sonra yorulmadınız mı?"],["Они живут в отеле с бассейном.","Onlar havuzlu bir otelde kalıyorlar."],["Поездка была очень утомительной.","Yolculuk çok yorucuydu."],["Пристегните, пожалуйста, ремни безопасности.","Lütfen emniyet kemerlerinizi takın."],["На какой остановке Вы выходите?","Hangi durakta iniyorsunuz?"],["Я поеду с ними в Каппадокию.","Onlarla Kapadokya'ya gideceğim."]],"grammar":[{"q":"Şehre ___ gittik.","h":"otobüs · на чём","o":["otobüsle","otobüse","otobüste","otobüsü"],"ru":"Мы поехали в город на автобусе."},{"q":"Bu ülkeye ___ girebilirsiniz.","h":"vize · без","o":["vizesiz","vizeli","vizeyle","vizeye"],"ru":"В эту страну можно въехать без визы."},{"q":"___ bir oda istiyoruz.","h":"manzara · с","o":["Manzaralı","Manzarasız","Manzaraya","Manzarada"],"ru":"Мы хотим номер с видом."},{"q":"Bavulum ___ kayboldu.","h":"havalimanı · местн.","o":["havalimanında","havalimanda","havalimanına","havalimanını"],"ru":"Мой чемодан потерялся в аэропорту."},{"q":"___ Bodrum'a otobüsle gittik.","h":"İzmir · откуда","o":["İzmir'den","İzmir'e","İzmir'de"," {"title":"Тело и здоровье","theme":"Чередования при склонении","level":"B1+","img":"img/u6-health.svg","imgAlt":"Аптечка, сердце и таблетка","tipTitle":"Как меняется слово при склонении: тело и здоровье","tip":"1) Чередования при склонении\nТолько перед окончанием на гласную:\n• p, ç, t, k → b, c, d, ğ: kitap → kitabı, ağaç → ağacı, renk → rengi, bilek → bileği, ilaç → ilacı. Односложные обычно не меняются: top → topu, saç → saçı.\n• Выпадает гласная второго слога: burun → burnu, ağız → ağzı, omuz → omzu, göğüs → göğsü, karın → karnı.\n• Удваивается согласная: hak → hakkı, his → hissi, tıp → tıbbı.\nПеред окончанием на согласную ничего не меняется: burunda, bilekte.\n2) Части тела: притяжательное + падеж\n«У меня болит …» = часть тела + -(ı)m + ağrıyor: başım ağrıyor, dişim ağrıyor.\nПадеж идёт после притяжательного, чередования сохраняются: burnumdan, kulağıma, karnımda.\nПример: Burnumdan kan geliyor. — У меня из носа идёт кровь.\n3) -dır — «уже (сколько времени)»\n-dır/-dir/-dur/-dür, после глухих -tır/-tir/-tur/-tür: iki gündür, üç aydır, beş yıldır, ne zamandır.\nГлагол стоит в настоящем времени. «С какого момента» — -dan beri: sabahtan beri.\nПример: İki gündür öksürüyorum. — Я кашляю уже два дня.","examples":[["Burnum tıkalı.","У меня заложен нос."],["Bileğimi burktum.","Я подвернул запястье."],["Bir haftadır omzum ağrıyor.","Уже неделю болит плечо."],["Burnumdan kan geliyor.","У меня из носа идёт кровь."],["İki gündür öksürüyorum.","Я кашляю уже два дня."]],"words":[["burun","нос"],["ağız","рот"],["omuz","плечо"],["göğüs","грудь"],["bilek","запястье"],["dirsek","локоть"],["boğaz","горло"],["tedavi","лечение"],["muayene","осмотр (у врача)"],["reçete","рецепт"],["ateş","температура, жар"],["iltihap","воспаление"],["baş","голова"],["mide","желудок"],["karın","живот"],["bel","поясница"],["diz","колено"],["bacak","нога"],["ayak bileği","лодыжка"],["parmak","палец"],["tırnak","ноготь"],["kulak","ухо"],["dudak","губа"],["diş","зуб"],["çene","подбородок, челюсть"],[ {"title":"Общество и новости","theme":"Послелоги и падежи","level":"B2.1","img":"img/u7-news.svg","imgAlt":"Газета и урна для голосования","tipTitle":"Послелоги, их падежи и глагольные конструкции","tip":"1) Какой падеж требует послелог\nС дательным: göre (по мнению, согласно) — bana göre; kadar (до) — akşama kadar; rağmen (несмотря на) — yağmura rağmen; karşı (против) — yasaya karşı; doğru (к, ближе к) — akşama doğru.\nС исходным: beri (с, начиная с) — 2015'ten beri; önce/sonra (до/после) — seçimden önce; dolayı (из-за) — enflasyondan dolayı; itibaren (начиная с) — ocaktan itibaren; başka (кроме) — bakandan başka.\nС родительным у местоимений: için, gibi, ile — benim için, onun gibi. С существительными — без падежа: Ali için.\n2) hakkında (о), tarafından (кем — в пассиве)\nСуществительное перед ними стоит без падежа: seçim hakkında — о выборах, hükümet tarafından — правительством.\nМестоимение стоит в родительном, а послелог получает аффикс принадлежности: benim hakkımda — обо мне, bizim hakkımızda — о нас, senin tarafından — тобой.\nПример: Yasa meclis tarafından kabul edildi. — Закон был принят парламентом.\n3) Глагол + послелог: -dığı için, -masına rağmen\nПричина «так как»: основа + -dığı/-diği/-duğu/-düğü (после глухих -tığı…) + için, с лицом: olduğum için — так как я…\nУступка «несмотря на то что»: основа + -ma/-me + аффикс принадлежности + дательный + rağmen: yağmasına rağmen.\nПример: Vergiler arttığı için halk protesto etti. — Так как налоги выросли, народ протестовал.\nПример: Çok çalışmasına rağmen seçimi kaybetti. — Несмотря на то что он много работал, он проиграл выборы.","examples":[["Araştırmaya göre işsizlik azaldı.","Согласно исследованию, безработица снизилась."],["Seçimden sonra yeni yasa çıktı.","После выборов вышел новый закон."],["Enflasyondan dolayı fiyatlar arttı.","Из-за инфляции цены выросли."],["Yasa meclis tarafından kabul edildi.","Закон был принят парламентом."],["Vergiler arttığı için halk protesto etti.","Так как налоги выросли, народ протестовал."]],"words":[["seçim","выборы"],["hükümet","правительство"],["yasa","закон"],["toplum","общество"],["eşitlik","равенство"],["göç","миграция"],["işsizlik","безработица"],["enflasyon","инфляция"],["araştırma","исследование"],["sonuç","результат"],["etki","влияние"],["artmak","расти, увеличиваться"],["haber","новость"],["gazeteci","журналист"],["basın","пресса"],["gündem","повестка дня"],["manşet","газетный заголовок"],["muhabir","корреспондент"],["seçmen","избиратель"],["oy","голос (на выборах)"],["oy vermek","голосовать"],["aday","кандидат"],["milletvekili","депутат"],["meclis","парламент"],["cumhurbaşkanı","президент"],["bakan","министр"],["muhalefet","оппозиция"],["iktidar","правящая власть"],["parti","партия"],["vatandaş","гражданин"],["özgürlük","свобода"],["adalet","справедливость"],["ayrımcılık","дискриминация"],["yoksulluk","бедность"],["gösteri","демонстрация"],["protesto etmek","протестовать"],["grev","забастовка"],["sendika","профсоюз"],["vergi","налог"],["bütçe","бюджет"],["kriz","кризис"],["anket","опрос"],["kamuoyu","общественное мнение"],["yürürlüğe girmek","вступать в силу"],["desteklemek","поддерживать"],["karşı çıkmak","выступать против"],["azalmak","уменьшаться"],["açıklama","заявление"],["açıklamak","объявлять, заявлять"],["tartışma","дискуссия, спор"],["göçmen","мигрант"],["mülteci","беженец"],["sivil toplum","гражданское общество"],["güvenlik","безопасность"],["yolsuzluk","коррупция"],["refah","благосостояние"],["anayasa","конституция"],["talep","требование"],["halk","народ"],["kabul etmek","принимать (закон)"]],"sentences":[["По-моему, эта новость неправда.","Bana göre bu haber doğru değil."],["За кого ты будешь голосовать?","Kime oy vereceksin?"],["Журналист написал статью о коррупции.","Gazeteci yolsuzluk hakkında bir makale yazdı."],["Мы обсуждали выборы до утра.","Sabaha kadar seçimleri tartıştık."],["Согласно исследованию, безработица снизилась.","Araştırmaya göre işsizlik azaldı."],["Из-за инфляции цены выросли.","Enflasyonda {"title":"Культура и искусство","theme":"-daki, -ki и сравнение","level":"B2.1","img":"img/u8-skyline.svg","imgAlt":"Силуэт старого города на закате","tipTitle":"-daki, -ki, сравнение и выражение времени","tip":"1) -daki, -ki и сравнение\n-daki/-deki — «находящийся в»: müzedeki heykel — скульптура в музее.\n-ki после родительного — «чей-то (предмет)»: benimki — мой, seninki — твой. Он склоняется через n: benimkinden — чем мой.\nСравнение: исходный + daha: Roman filmden daha ilginç — Роман интереснее фильма. Превосходная степень: en: en ünlü ressam.\n«Один из»: исходный + biri: en ünlü yazarlardan biri.\n2) -ki после слов времени\nК словам времени -ki присоединяется прямо, без -da: yarınki — завтрашний, şimdiki — нынешний, geçen yılki — прошлогодний.\nГармонии -ki не подчиняется; исключения: bugünkü — сегодняшний, dünkü — вчерашний.\nПример: Dünkü konser harikaydı. — Вчерашний концерт был замечательным.\n3) -dan beri и -dır\n-dan/-den beri — «с (какого момента)»: 1914'ten beri, çocukluğumdan beri.\n-dır/-dir/-dur/-dür (после глухих -tır…) — «уже (сколько времени)»: üç gündür, iki yıldır, yüzyıllardır.\nПример: Bu tiyatro 1914'ten beri açık. — Этот театр открыт с 1914 года.\nПример: Bu romanı üç gündür okuyorum. — Я читаю этот роман уже три дня.","examples":[["Müzedeki heykeller çok eski.","Скульптуры в музее очень старые."],["Roman filmden daha ilginç.","Роман интереснее фильма."],["O en ünlü şairlerden biri.","Он один из самых известных поэтов."],["Dünkü konser harikaydı.","Вчерашний концерт был замечательным."],["Bu tiyatro 1914'ten beri açık.","Этот театр открыт с 1914 года."]],"words":[["sergi","выставка"],["eser","произведение"],["yazar","писатель"],["şiir","стихотворение"],["roman","роман"],["sahne","сцена"],["gelenek","традиция"],["miras","наследие"],["yüzyıl","век, столетие"],["heykel","скульптура"],["ressam","художник"],["eleştiri","критика"],["tiyatro","театр"],["oyuncu","актёр"],["yönetmen","режиссёр"],["senaryo","сценарий"],["oyun","пьеса, спектакль"],["s function meow() {
  playMeow(audioHolder);
  haptic("tap");
  if (meowTimer) clearTimeout(meowTimer);
  set({ meowing: true });
  meowTimer = setTimeout(function () { set({ meowing: false }); }, 900);
}

function check() {
  var L = st.lesson; if (!L || L.status !== "answer") return;
  var ex = L.queue[L.idx], ok = false;
  if (ex.type === "choice" || ex.type === "grammar" || ex.type === "decline") { if (L.sel === null) return; ok = L.sel === ex.correct; }
  else if (ex.type === "build") {
    if (!L.placed.length) return;
    var said = L.placed.map(function (id) { return ex.tiles.filter(function (t) { return t.id === id; })[0].text; }).join(" ");
    ok = low(said) === low(ex.answer.join(" "));
  } else return;
  var combo = ok ? L.combo + 1 : 0;
  if (ex.type === "choice") { var words = Object.assign({}, st.words); bumpWord(words, ex.word, ok); st.words = words; persist(); }
  var patch = { status: ok ? "right" : "wrong", combo: combo, maxCombo: Math.max(L.maxCombo, combo), mistakes: L.mistakes + (ok ? 0 : 1), firstOk: L.firstOk + (ok && !ex.retry ? 1 : 0) };
  if (L.skip && !ok) patch.hearts = L.hearts - 1;
  haptic(ok ? "ok" : "bad");
  setL(patch);
  if (ok && (ex.type === "build" || ex.type === "decline" || ex.type === "grammar")) speak(ex.type === "decline" ? ex.correct : ex.full);
}

function next() {
  var L = st.lesson; if (!L) return;
  var ex = L.queue[L.idx], q = L.queue.slice(), done = L.done;
  var reset = { status: "answer", sel: null, placed: [], mSelL: null, mSelR: null, mDone: [], mBad: null, revealed: false };
  if (L.skip) {
    var nd = L.done + 1, ni = L.idx + 1;
    if (L.hearts <= 0 || ni >= q.length) { finish(Object.assign({}, L, { done: nd })); return; }
    setL(Object.assign({ idx: ni, done: nd }, reset)); autoSpeak(q[ni]); return;
  }
  if (L.status === "wrong" && !ex.retry) {
    var copy = JSON.parse(JSON.stringify(ex)); copy.retry = true;
    if (copy.tiles) copy.tiles = shuffle(copy.tiles);
    if (copy.options) copy.options = shuffle(copy.options);
    q.push(copy);
  } else { done++; }
  var idx = L.idx + 1;
  if (idx >= q.length) { finish(Object.assign({}, L, { done: done, queue: q })); return; }
  setL(Object.assign({ queue: q, idx: idx, done: done }, reset));
  autoSpeak(q[idx]);
}

function streakAfter(today) {
  var first = st.lastDay !== today;
  var s = first ? ((st.lastDay && daysBetween(st.lastDay, today) === 1) ? st.streak + 1 : 1) : st.streak;
  return { first: first, streak: s };
}

function finish(L) {
  var today = dayStr();
  var progress = Object.assign({}, st.progress), gain, result;
  var sa = streakAfter(today);
  var before = levelInfo(st.progress).label;
  if (L.skip) {
    var passed = L.hearts > 0;
    gain = passed ? 30 : 5;
    if (passed) { for (var u = 0; u <= L.ui; u++) LESSON_DEFS.forEach(function (D, li) { progress[lkey(u, li)] = true; }); }
    result = { failed: !passed, title: passed ? "Юнит пропущен!" : "Пока не получилось",
      sub: passed ? ("Уроки юнитов 1–" + (L.ui + 1) + " засчитаны. Слова добавлены в словарь.") : "Закончились жизни. Пройдите пару уроков юнита и попробуйте снова — котик верит в вас!" };
  } else {
    var isTest = L.li >= 0 && LESSON_DEFS[L.li].kind === "test";
    gain = (isTest ? 20 : 10) + (L.mistakes === 0 ? 5 : 0);
    if (L.li >= 0) progress[L.key] = true;
    result = { failed: false, title: L.key === "practice" ? "Повторение завершено!" : (L.key === "cases" ? "Падежи покорены!" : (isTest ? "Юнит пройден!" : "Урок пройден!")),
      sub: L.mistakes === 0 ? "Без единой ошибки — бонус +5 XP" : "Ошибки вернулись в конец урока — так они лучше запоминаются" };
  }
  var after = levelInfo(progress).label;
  var xpByDay = Object.assign({}, st.xpByDay); xpByDay[today] = (xpByDay[today] || 0) + gain;
  Object.assign(result, { gain: gain, acc: Math.round(100 * L.firstOk / Math.max(1, L.total)), combo: L.maxCombo, levelUp: before !== after ? after : null, showStreak: sa.first });
  st.progress = progress; st.xp = st.xp + gain; st.xpByDay = xpByDay; st.streak = sa.streak; st.lastDay = today;
  result.food = FOOD_PER_LESSON;
  feedPet(FOOD_PER_LESSON);
  persist();
  writeCloudNow();
  scheduleReminder();
  set({ screen: "result", result: result, lesson: null });
}

function tapMatch(side, p) {
  var L = st.lesson; if (!L || L.status !== "answer") return;
  if (L.mDone.indexOf(p) >= 0) return;
  var selL = side === "L" ? p : L.mSelL, selR = side === "R" ? p : L.mSelR;
  if (selL === null || selR === null) { setL({ mSelL: selL, mSelR: selR, mBad: null }); return; }
  var ex = L.queue[L.idx], words = Object.assign({}, st.words);
  if (selL === selR) {
    var mDone = L.mDone.concat([selL]);
    bumpWord(words, ex.pairs[selL][0], true); st.words = words; persist();
    haptic(mDone.length === ex.pairs.length ? "ok" : "tap");
    if (mDone.length === ex.pairs.length) {
      var combo = L.combo + 1;
      setL({ mDone: mDone, mSelL: null, mSelR: null, mBad: null, status: "right", combo: combo, maxCombo: Math.max(L.maxCombo, combo), firstOk: L.firstOk + (ex.retry ? 0 : 1) });
    } else setL({ mDone: mDone, mSelL: null, mSelR: null, mBad: null });
    speak(ex.pairs[selL][0]);
  } else {
    bumpWord(words, ex.pairs[selL][0], false); st.words = words; persist();
    haptic("bad");
    setL({ mSelL: null, mSelR: null, mBad: [selL, selR], combo: 0 });
    setTimeout(function () { if (st.lesson && st.lesson.mBad) setL({ mBad: null }); }, 650);
  }
}

function viewPath(lv) {

  var h = '';
  var ps = petState();

    var sk = st.lastDay && daysBetween(st.lastDay, today) === 1 ? st.streak : 0;
    var msg = ps === "hungry" ? petName() + " голодает: миска пуста, серия сгорела. Покормите его — пройдите урок!" : (sk > 0 ? petName() + " ждёт ужин! Не потеряйте серию: " + sk + " дн." : petName() + " ждёт ужин — миска пустая.");

    '<div class="week-title">' + esc(lv.cur < 0 ? "Курс пройден — вы на уровне B2. Держите форму в тренировке падежей." : ("Цель недели: «" + UNITS[lv.cur].title + "» — " + UNITS[lv.cur].theme.toLowerCase())) + '</div>' +
    '<div class="bar thick"><i style="width:' + goalW + '%;background:var(--gold)"></i></div>' +
    '<div class="row-between muted sm"><span>Путь к B2</span><span>' + lv.pct + '%</span></div>' +
    '<div class="bar"><i style="width:' + lv.pct + '%;background:var(--blue)"></i></div></section>';
  var startedA = false;
  for (var au = 0; au < A_SHIFT; au++) { for (var al = 0; al < LPU; al++) { if (st.progress[lkey(au, al)]) { startedA = true; break; } } if (startedA) break; }
  if (!startedA) {
    h += '<section class="card placement"><div class="pl-head"><img src="' + IMG.happy + '" alt="" width="52" height="52"><div><b>Уже знаете основы турецкого?</b><span>Начните с A1 — или сдайте контрольную и перейдите сразу на нужный уровень.</span></div></div>' +
      '<div class="pl-row"><button type="button" class="pl-btn" data-a="skip" data-u="3">' + ICON.ff + 'Сразу на A2</button><button type="button" class="pl-btn" data-a="skip" data-u="7">' + ICON.ff + 'Сразу на B1</button></div></section>';
  }
  var firstOpen = null;

  var curU = lv.cur < 0 ? UNITS.length - 1 : lv.cur;
  var openU = st.openUnit === null ? curU : st.openUnit;
  UNITS.forEach(function (U, ui) {
    var col = UNIT_COLORS[ui % UNIT_COLORS.length];
    var weekLocked = !!st.weekLock && ui + 1 > weekNow;
    var doneCount = LESSON_DEFS.filter(function (D, li) { return !!st.progress[lkey(ui, li)]; }).length;
    var isOpen = openU === ui;
    h += '<section class="unit tiles" style="background-color:' + col[2] + '">' +
      '<img class="unit-img" src="' + U.img + '" alt="' + esc(U.imgAlt) + '">' +
      '<div class="unit-banner" style="background:' + col[0] + ';box-shadow:0 4px 0 ' + col[1] + '"><div class="unit-text"><span class="eyebrow">НЕДЕЛЯ ' + (ui + 1) + ' · ' + esc(U.level) + '</span><span class="unit-title">' + esc(U.title) + '</span><span class="unit-theme">' + esc(U.theme) + '</span></div>' +
      '<button type="button" class="theory-btn' + (tipSeen(ui) ? "" : " glow") + '" data-a="tip" data-u="' + ui + '" style="color:' + col[1] + '" aria-label="Теория юнита: правило и таблицы">' + BOOK_OPEN + '<span>Теория</span>' + (tipSeen(ui) ? "" : '<i class="beacon" aria-hidden="true"></i>') + '</button></div>' +
      '<div class="unit-prog"><div class="bar white"><i style="width:' + Math.round(doneCount / LPU * 100) + '%;background:' + col[0] + '"></i></div><span>' + doneCount + ' из ' + LPU + ' уроков</span></div>' +
      '<button type="button" class="unit-toggle" data-a="toggle" data-u="' + ui + '" style="color:' + col[1] + '" aria-expanded="' + isOpen + '">' + (isOpen ? "Свернуть уроки" : ("Показать уроки · " + doneCount + "/" + LPU)) + '</button>';
    if (doneCount < LPU) h += '<button type="button" class="skip-btn" data-a="skip" data-u="' + ui + '" style="border-color:' + col[0] + ';color:' + col[1] + '">' + ICON.ff + 'ЗНАЮ ЭТО — СДАТЬ КОНТРОЛЬНУЮ</button>';
    if (weekLocked) h += '<div class="lock-text">Откроется через ' + Math.max(1, ui * 7 - daysSince) + ' дн. — по одному юниту в неделю</div>';
    if (isOpen && !tipSeen(ui)) {
      h += '<div class="theory-hint"><img src="' + IMG.happy + '" alt="" width="56" height="56"><div class="th-bubble"><b>Начните с теории</b><span>Там правило юнита, примеры и таблицы склонения — уроки пойдут легче.</span>' +

      h += '</div>';

    h += '</section>';
  });
  h += '<div class="card finish">' + catHtml(IMG.party, 110) + '<span class="finish-title">Финиш: уровень B2</span><span class="muted">Закрывайте по одной контрольной в неделю</span></div>';

}

function viewWords() {

    h += '<section class="card nopad"><div class="group-head" style="background:' + UNIT_COLORS[ui % UNIT_COLORS.length][0] + '">ЮНИТ ' + (ui + 1) + ' · ' + esc(U.title.toUpperCase()) + ' · ' + ws.length + '</div><div class="group-body">' +
      ws.map(function (w) {

function optStyle(L, ex, o) {
  var answered = L.status !== "answer", sel = L.sel === o;
  if (answered && o === ex.correct) return "opt ok";
  if (answered && sel) return "opt bad";
  if (!answered && sel) return "opt sel";
  return "opt";
}

function pawHint(L, text, isTr) {
  if (!text || L.status !== "answer" || !hintsAllowed(L)) return "";
  var on = L.hintIdx === L.idx;
  return '<button type="button" class="paw-q' + (on ? " on" : "") + '" data-a="wordHint" aria-expanded="' + on + '" aria-label="Подсказка: показать перевод">' + PAW + '<b>?</b></button>' +
    (on ? '<span class="hint-pop" role="status">' + (isTr ? '<button type="button" class="hp-say" data-a="say" data-s="' + esc(text) + '" aria-label="Произнести">' + ICON.speaker("#FFFFFF", 18) + '</button>' : "") + '<span>' + esc(text) + '</span></span>' : "");
}
function hintsAllowed(L) { return !L.skip && !(L.li >= 0 && LESSON_DEFS[L.li] && LESSON_DEFS[L.li].kind === "test"); }
function viewLesson() {
  var L = st.lesson, ex = L.queue[L.idx], answered = L.status !== "answer", ok = L.status === "right";
  var catSrc = L.status === "wrong" ? IMG.sad : (L.status === "right" ? IMG.party : IMG.happy);
  var title = ex.retry ? "Ещё раз: " + ex.title.charAt(0).toLowerCase() + ex.title.slice(1) : ex.title;
  var progColor = L.combo >= 3 ? "var(--gold)" : (L.skip ? "#A23B72" : "var(--teal)");
  var h = '<div class="screen tiles lesson">';
  h += '<div class="lesson-top"><button type="button" class="icon-btn" data-a="quit" aria-label="Выйти из урока">' + ICON.x() + '</button>' +
    '<div class="lt-mid"><span class="combo">' + (L.combo >= 3 ? "СЕРИЯ ×" + L.combo : "") + '</span><div class="bar thick lbar"><i style="width:' + Math.round(L.done / L.total * 100) + '%;background:' + progColor + '"></i></div><span class="combo"></span></div>' +
    (L.skip ? '<span class="hearts" aria-label="Осталось жизней: ' + Math.max(0, L.hearts) + '">' + ICON.heart + Math.max(0, L.hearts) + '</span>' : "") + '</div>';

        ((L.revealed || answered) ? '<span class="prompt">' + esc(ex.prompt) + '</span>' : '<button type="button" class="link" data-a="reveal">Нет звука? Показать слово</button>') + '</div>';
    } else {
      h += '<div class="card prompt-card">' + (ex.mode === "tr2ru" ? '<button type="button" class="say" data-a="sayEx" aria-label="Прослушать">' + ICON.speaker() + '</button>' : "") +
        '<div class="prompt-wrap"><span class="prompt">' + esc(ex.prompt) + '</span>' + pawHint(L, ex.mode === "tr2ru" ? ex.ru : ex.word, ex.mode === "ru2tr") + '</div></div>';
    }
    h += '<div class="opts">' + ex.options.map(function (o, i) { return '<button type="button" class="' + optStyle(L, ex, o) + '" data-a="pick" data-i="' + i + '">' + esc(o) + '</button>'; }).join("") + '</div>';
  } else if (ex.type === "decline") {
    var exam = !hintsAllowed(L);
    h += '<div class="card decl">' + '<span class="case-chip" style="background:' + ex.color + '">' + esc(ex.chip || (ex.caseName + " ПАДЕЖ")) + '</span>' + '<span class="decl-noun">' + esc(ex.noun) + '</span>' + (ex.ruPhrase && exam ? '<span class="decl-ru">' + esc(ex.ruPhrase) + ' <i>(' + esc(ex.ruQ) + ')</i></span><span class="exam-note">Контрольная: без подсказки окончания</span>' : "") + (ex.ruPhrase && !exam ? '<span class="decl-ru">' + esc(ex.ruPhrase) + ' <i>(' + esc(ex.ruQ) + ')</i></span><div class="end-hint"><span class="eh-label">Окончание</span><span class="eh-end">' + redify(ex.endHint) + '</span><span class="eh-role">' + esc(ex.roleHint) + '</span></div>' : "") + (!ex.ruPhrase ? '<span class="muted">' + esc(ex.ru) + ' · ' + esc(ex.caseQ) + '</span>' : "") + '</div>';
    h += '<div class="opts grid2">' + ex.options.map(function (o, i) { return '<button type="button" class="' + optStyle(L, ex, o) + ' center" data-a="pick" data-i="' + i + '">' + esc(o) + '</button>'; }).join("") + '</div>';
  } else if (ex.type === "grammar") {
    var blank = answered ? ex.correct : (L.sel || " ");
    var bcol = answered ? (ok ? "#2E7D32" : "#C0392B") : (L.sel ? "#1F5FAE" : "#8A8378");
    h += '<div class="card gram"><div class="gram-line">' + (ex.before ? '<span>' + esc(ex.before) + '</span>' : "") + '<span class="blank" style="border-color:' + bcol + ';color:' + bcol + '">' + esc(blank) + '</span>' + (ex.after ? '<span>' + esc(ex.after) + '</span>' : "") + '</div>' +
      '<span class="muted">' + esc(ex.ru) + '</span>' + (hintsAllowed(L) ? '<span class="hint">Подсказка: ' + esc(ex.hint) + '</span>' : '<span class="hint exam">Слово: ' + esc(String(ex.hint).split(" · ")[0]) + '</span>') + '</div>';
    h += '<div class="opts grid2">' + ex.options.map(function (o, i) { return '<button type="button" class="' + optStyle(L, ex, o) + ' center" data-a="pick" data-i="' + i + '">' + esc(o) + '</button>'; }).join("") + '</div>';
  } else if (ex.type === "build") {
    h += '<div class="card build-ru"><div class="prompt-wrap"><span>' + esc(ex.ru) + '</span>' + pawHint(L, ex.full, true) + '</div></div>';
    h += '<div class="answer-zone">' + L.placed.map(function (id, pos) { var t = ex.tiles.filter(function (x) { return x.id === id; })[0]; return '<button type="button" class="tile-btn" data-a="placed" data-p="' + pos + '">' + esc(t.text) + '</button>'; }).join("") + '</div>';
    h += '<div class="bank">' + ex.tiles.map(function (t) {
      return L.placed.indexOf(t.id) >= 0 ? '<span class="tile-btn ghost-tile" aria-hidden="true">' + esc(t.text) + '</span>' : '<button type="button" class="tile-btn" data-a="bank" data-id="' + t.id + '">' + esc(t.text) + '</button>';
    }).join("") + '</div>';
  } else if (ex.type === "match") {
    function item(side, p) {
      var done = L.mDone.indexOf(p) >= 0, sel = side === "L" ? L.mSelL === p : L.mSelR === p;
      var bad = L.mBad && (side === "L" ? L.mBad[0] === p : L.mBad[1] === p);
      var cls = "opt center match" + (done ? " done" : (bad ? " bad" : (sel ? " sel" : "")));
      return '<button type="button" class="' + cls + '" data-a="match" data-side="' + side + '" data-p="' + p + '"' + (done ? " disabled" : "") + '>' + esc(ex.pairs[p][side === "L" ? 0 : 1]) + '</button>';
    }
    h += '<div class="match-grid"><div class="mcol">' + ex.left.map(function (p) { return item("L", p); }).join("") + '</div><div class="mcol">' + ex.right.map(function (p) { return item("R", p); }).join("") + '</div></div>';
  }
  h += '</main>';

  var answerText = "";
  if (ex.type === "choice") answerText = ex.word + " — " + ex.ru;
  else if (ex.type === "decline" && ex.answerText) answerText = ex.answerText;
  else if (ex.type === "decline") answerText = ex.full + " (" + ex.caseName.toLowerCase() + " падеж: " + ex.ruQ + ")";
  else if (ex.type === "grammar" || ex.type === "build") answerText = ex.full;
  else if (ex.type === "match") answerText = "Все пары найдены";
  if (answered) {
    var praise = ["Отлично!", "Верно!", "Так держать!", "Супер!", "Harika!", "Çok iyi!"];
    var t = ok ? (L.combo >= 3 ? "Серия ×" + L.combo + "!" : praise[L.idx % praise.length]) : "Правильный ответ:";
    h += '<div class="foot ' + (ok ? "good" : "fail") + '"><div class="fb-title">' + (ok ? ICON.okc : ICON.badc) + '<span>' + esc(t) + '</span></div>' + (answerText ? '<span class="fb-answer">' + esc(answerText) + '</span>' : "") +
      '<button type="button" class="cta ' + (ok ? "green" : "red") + '" data-a="next">ПРОДОЛЖИТЬ</button></div>';
  } else if (ex.type === "match") {
    h += '<div class="foot"><span class="match-hint">Нажмите слово слева, затем его перевод справа</span></div>';
  } else {
    var ready = ex.type === "build" ? L.placed.length > 0 : L.sel !== null;
    h += '<div class="foot"><button type="button" class="cta ' + (ready ? "blue" : "off") + '" data-a="check"' + (ready ? "" : " disabled") + '>ПРОВЕРИТЬ</button></div>';
  }
  return h + '</div>';
}

function viewResult() {
  var R = st.result;
  return '<div class="screen tiles result" style="background-color:#E6EEFA"><div class="center-col">' + catHtml(R.failed ? IMG.sad : IMG.party, 200) +
    '<span class="res-title">' + esc(R.title) + '</span><span class="res-sub">' + esc(R.sub) + '</span><span class="res-food">' + FISH + esc(petName()) + ' получил +' + kibble(R.food || FOOD_PER_LESSON) + '</span>' +
    (R.levelUp ? '<div class="levelup">Новый уровень: ' + esc(R.levelUp) + '</div>' : "") +
    '<div class="res-tiles"><div class="rt" style="border-color:#F5B700"><span style="background:#F5B700;color:#3D2B00">ОПЫТ</span><b style="color:#8A5F00">+' + R.gain + '</b></div>' +
    '<div class="rt" style="border-color:#0E7C70"><span style="background:#0E7C70">ТОЧНОСТЬ</span><b style="color:#0E7C70">' + R.acc + '%</b></div>' +
    '<div class="rt" style="border-color:#A23B72"><span style="background:#A23B72">СЕРИЯ</span><b style="color:#A23B72">×' + R.combo + '</b></div></div></div>' +
    '<div class="foot plain"><button type="button" class="cta blue" data-a="claim">ЗАБРАТЬ ОЧКИ</button></div></div>';
}

function viewStreak() {
  var today = dayStr(), dow = (new Date().getDay() + 6) % 7, monday = addDays(today, -dow);
  var s = st.streak, n10 = s % 10, n100 = s % 100;
  var word = (n10 === 1 && n100 !== 11) ? "день подряд!" : ((n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) ? "дня подряд!" : "дней подряд!");
  var days = WEEKDAYS.map(function (lab, i) { var d = addDays(monday, i), done = (st.xpByDay[d] || 0) > 0; return '<div class="sd"><span' + (i === dow ? ' class="today"' : "") + '>' + lab + '</span><i' + (done ? ' class="done"' : "") + '>' + (done ? ICON.check : "") + '</i></div>'; }).join("");
  return '<div class="screen tiles streak" style="background-color:#FFF0E3"><div class="center-col"><div class="streak-art">' + catHtml(IMG.happy, 130, "left") +
    '<svg width="96" height="96" viewBox="0 0 24 24" fill="#F97316" stroke="#C2410C" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 1.6 1 2.5 2 3 0-3-.5-5.5.5-8z"/></svg></div>' +
    '<span class="streak-num">' + s + '</span><span class="streak-word">' + word + '</span><div class="streak-days">' + days + '</div>' +
    '<span class="res-sub">Каждый день — шаг по пути. Раз в неделю закрывайте контрольную, чтобы поднять уровень.</span></div>' +
    '<div class="foot plain"><button type="button" class="cta orange" data-a="closeStreak">ПРОДОЛЖИТЬ</button></div></div>';
}

function viewPlay() {
  var it = shopItem(st.playToy); if (!it) return "";
  return '<div class="sheet-bg" data-a="closePlay"></div><div class="play-pop" role="dialog" aria-modal="true" aria-label="Новая игрушка">' +
    '<span class="eyebrow play-eye">НОВАЯ ИГРУШКА!</span>' +
    '<div class="play-scene"><div class="play-cat"><img class="play-paw" src="img/cat-paw.svg" alt=""><img src="img/cat-play.svg" alt="">' + wearHtml() + '</div>' +
    '<img class="play-toy t-' + it.id + '" src="' + it.img + '" alt=""><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></div>' +
    '<p class="play-text"><b>' + esc(petName()) + ' играет ' + esc(it.with || "") + '!</b><span>Спасибо, хозяин! Теперь мне не скучно, пока ты учишь турецкий.</span></p>' +
    '<button type="button" class="cta orange" data-a="closePlay">УРА!</button></div>';
}

function viewTip() {
  var ui = st.tipUnit, U = UNITS[ui], col = UNIT_COLORS[ui % UNIT_COLORS.length];
  var h = '<div class="sheet-bg" data-a="closeTip"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(U.tipTitle) + '">' +
    '<div class="row-between top"><div class="sheet-head"><span class="eyebrow" style="color:' + col[0] + '">ПРАВИЛО ЮНИТА</span><span class="sheet-title">' + esc(U.tipTitle) + '</span></div><button type="button" class="icon-btn boxed" data-a="closeTip" aria-label="Закрыть">' + ICON.x("#5E5A52", 20) + '</button></div>' +
    richTip(ui) + '<div class="examples">' + U.examples.map(function (e) {
      return '<div class="example"><button type="button" class="say" data-a="say" data-s="' + esc(e[0]) + '" aria-label="Произнести пример">' + ICON.speaker("#1F5FAE", 20) + '</button><div class="word-txt"><b>' + esc(e[0]) + '</b><span>' + esc(e[1]) + '</span></div></div>';
    }).join("") + '</div><span class="eyebrow" style="color:' + col[0] + '">ТАБЛИЦА СКЛОНЕНИЯ</span>' + declTables(U, col) +
    (st.tipThenStart ? '<div class="tip-go"><button type="button" class="cta blue" data-a="tipGo">ПОНЯТНО, К УРОКУ</button></div>' : "") + '</div>';
  if (st.tipThenStart) h = h.replace('<div class="row-between top">', '<div class="tip-first"><img src="' + IMG.happy + '" alt="" width="44" height="44"><span>Перед первым уроком загляните в правило — котик советует!</span></div><div class="row-between top">');
  return h;
}

function paintSafeAreas() {
  var top = "#FFF3E0", bot = "#FFF3E0";
  if (window.innerWidth <= 520) {
    if (st.screen === "home") { top = "#1A4E8F"; bot = "#FFFFFF"; }
    else if (st.screen === "lesson" && st.lesson) { var s = st.lesson.status; bot = s === "right" ? "#E8F5E9" : (s === "wrong" ? "#FDECEA" : "#FFFFFF"); }
    else if (st.screen === "result") { top = bot = "#E6EEFA"; }
    else if (st.screen === "streak") { top = bot = "#FFF0E3"; }
  }
  document.body.style.background = "linear-gradient(to bottom, " + top + " 0, " + top + " 50%, " + bot + " 50%, " + bot + " 100%)";
}

function render() {
  paintSafeAreas();
  var root = document.getElementById("app");
  var sc = root.querySelector(".scroll");
  var key = st.screen + ":" + st.tab + ":" + (st.lesson ? st.lesson.idx : "");
  var top = (sc && root.getAttribute("data-key") === key) ? sc.scrollTop : 0;
  var sheetSc = root.querySelector(".sheet");
  var sheetTop = sheetSc ? sheetSc.scrollTop : 0;
  var h;
  if (st.screen === "lesson" && st.lesson) h = viewLesson();
  else if (st.screen === "result" && st.result) h = viewResult();
  else if (st.screen === "streak") h = viewStreak();
  else h = viewHome();
  if (st.tipUnit !== null && st.tipUnit !== undefined) h += viewTip();
  else if (st.playToy && st.screen === "home" && st.tab === "pet") h += viewPlay();
  root.innerHTML = h;
  root.setAttribute("data-key", key);
  var sc2 = root.querySelector(".scroll");
  if (sc2) {
    var cur = scrollToCurrent && st.screen === "home" && st.tab === "path" && !reminderDue() ? root.querySelector(".node.current") : null;
    if (scrollToCurrent && reminderDue()) { scrollToCurrent = false; top = 0; }
    if (cur) {
      sc2.scrollTop = 0;
      var rel = cur.getBoundingClientRect().top - sc2.getBoundingClientRect().top;
      if (rel > sc2.clientHeight - 140) sc2.scrollTop = Math.max(0, rel - sc2.clientHeight / 2 + 40);
      scrollToCurrent = false;
    } else sc2.scrollTop = top;
  }
  var sh = root.querySelector(".sheet"); if (sh) sh.scrollTop = sheetTop;
}

loadLocal();
if (!st.startDate) st.startDate = dayStr();
checkSpoil();
if (!st.reminder) st.reminder = { on: false, time: "19:00" };
render();
initCloud();
scheduleReminder();
setInterval(function () { if (st.screen === "home" && st.tab === "path" && reminderDue() && !document.querySelector(".remind")) render(); }, 60000);
try { if (window.speechSynthesis) window.speechSynthesis.getVoices(); } catch (e) {}

</script>
